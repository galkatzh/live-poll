<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Live poll</title>
<!--
  The audience's page. It holds no questions of its own: everything it shows
  (title, question, options, open or closed, the revealed answer) comes from
  the host — a slide deck, or board.html — over the channel in transport.js,
  and it sends back one vote per question, changeable until the host closes
  the poll. All text from the host is shown as plain text. See PROTOCOL.md.

  index.html#r=<room>                       the default public brokers
  index.html#r=<room>&b=wss://a,wss://b     other brokers (wss:// only)
  index.html#r=<room>&p=<prefix>            another topic prefix
  index.html#r=<room>&t=local               BroadcastChannel (rehearsal, tests)
-->
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb;
    --card: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #8a8985;
    --line: #e4e3df;
    --accent: #2a78d6;
    --accent-soft: #e8f1fc;
    --good: #0c7d0c;
    --bad: #c23434;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1a1a19;
      --card: #242423;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --ink-3: #8f8e86;
      --line: #383835;
      --accent: #3987e5;
      --accent-soft: #1f3550;
      --good: #3fbf3f;
      --bad: #e66767;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--ink-2); letter-spacing: .02em; overflow-wrap: anywhere; }
  #conn { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; flex: none; }
  #conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  #conn.up::before { background: var(--good); }
  #conn.down::before { background: var(--bad); }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 520px; width: 100%; margin: 0 auto; padding: 24px 0; }
  .kicker { font-size: 14px; color: var(--ink-3); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  #prompt { font-size: 22px; line-height: 1.3; font-weight: 600; margin: 0 0 22px; overflow-wrap: anywhere; white-space: pre-line; }
  .muted { color: var(--ink-2); }
  #options { display: flex; flex-direction: column; gap: 12px; }
  #options.pair { flex-direction: row; }
  #options.pair button { flex: 1; min-height: 120px; font-size: 22px; }
  button.opt {
    appearance: none; border: 2px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 14px; padding: 16px 18px; min-height: 60px; font: inherit; font-size: 18px;
    text-align: left; cursor: pointer; transition: border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent; overflow-wrap: anywhere;
  }
  #options.pair button.opt { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  #options.pair .big { font-size: 44px; font-weight: 700; line-height: 1; }
  #options.pair .lbl { font-size: 16px; color: var(--ink-2); }
  button.opt:active { transform: scale(.99); }
  button.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  button.opt.answer { border-color: var(--good); }
  button.opt:disabled { cursor: default; opacity: .65; }
  button.opt.sel:disabled, button.opt.answer:disabled { opacity: 1; }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; margin-left: 8px; }
  .tag.you { color: var(--accent); }
  .tag.ans { color: var(--good); }
  #status { min-height: 1.5em; margin: 18px 0 0; font-size: 15px; color: var(--ink-2); }
  #status.ok { color: var(--good); }
  #status.err { color: var(--bad); }
  #score { font-size: 14px; color: var(--ink-3); text-align: center; }
  .wait { text-align: center; }
  .wait p { margin: 6px 0; }
  .dots::after { content: "…"; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Live poll</h1>
  <span id="conn">connecting</span>
</header>
<main id="main" aria-live="polite">
  <div class="wait"><p class="dots">Connecting</p></div>
</main>
<div id="score"></div>
<script src="mqtt.min.js"></script>
<script src="transport.js"></script>
<script>
(function () {
  "use strict";
  const T = window.LivePollTransport;
  const params = new URLSearchParams(location.hash.slice(1));
  const room = params.get("r") || "";
  const prefix = params.get("p") || T.DEFAULT_PREFIX;
  const kind = params.get("t") === "local" ? "local" : "mqtt";
  const brokers = params.get("b") ? params.get("b").split(",") : undefined;
  const $main = document.getElementById("main");
  const $conn = document.getElementById("conn");
  const $score = document.getElementById("score");
  const $title = document.getElementById("title");
  const clip = (s, n) => String(s == null ? "" : s).slice(0, n);

  // Browser storage is a convenience: it keeps the voter id and your own
  // votes across a reload. Without it everything still works for this load.
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
  };
  // `voter=` in the hash pins the id: several "phones" as tabs of one browser
  // (rehearsals, tests) would otherwise share one stored id and one vote.
  let voter = /^[A-Za-z0-9]{4,40}$/.test(params.get("voter") || "") ? params.get("voter") : store.get("live-poll/voter", null);
  if (!voter) {
    voter = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/-/g, "").slice(0, 16);
    store.set("live-poll/voter", voter);
  }
  const mineKey = `live-poll/votes/${prefix}/${room}`;
  const mine = store.get(mineKey, {});   // q -> {choice, answer, scored}

  let state = null;       // the last state the host sent
  let scoreText = "";     // the host's wording for the running score
  let pending = null;     // {q, choice} not yet acknowledged by any broker
  let transport = null;

  function el(tag, attrs, text) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  function renderScore() {
    const scored = Object.values(mine).filter((m) => m.scored && m.answer != null && m.choice != null);
    if (!scored.length) { $score.textContent = ""; return; }
    const right = scored.filter((m) => m.choice === m.answer).length;
    const tpl = scoreText || "{right} of {total} right";
    $score.textContent = tpl.replace("{right}", right).replace("{total}", scored.length);
  }

  function render(statusText, statusClass) {
    $main.textContent = "";
    if (!room || !T.ROOM.test(room)) {
      $main.append(el("div", { class: "wait" }, "This link is missing its room code. Scan the QR code on the screen again."));
      return;
    }
    if (!state || !state.q) {
      const w = el("div", { class: "wait" });
      w.append(el("p", {}, "You're in."), el("p", { class: "muted dots" }, "Waiting for the next question"));
      $main.append(w);
      renderScore();
      return;
    }
    const q = state.q;
    const my = mine[q] || {};
    const choice = pending && pending.q === q ? pending.choice : my.choice;
    if (state.kicker) $main.append(el("p", { class: "kicker" }, state.kicker));
    $main.append(el("p", { id: "prompt" }, state.prompt));
    const opts = el("div", { id: "options", class: state.options.length === 2 && state.layout === "pair" ? "pair" : "" });
    state.options.forEach((label, i) => {
      const b = el("button", { class: "opt", type: "button", "data-i": String(i) });
      // Side-by-side options may read "<big> — <small>": "0 — not acceptable".
      const parts = state.layout === "pair" ? label.split(" — ") : [label];
      if (parts.length === 2) {
        b.append(el("span", { class: "big" }, parts[0]), el("span", { class: "lbl" }, parts[1]));
        b.setAttribute("aria-label", label);
      } else {
        b.textContent = label;
      }
      if (choice === i) {
        b.classList.add("sel");
        b.setAttribute("aria-pressed", "true");
      }
      if (state.revealed && state.answer === i) {
        b.classList.add("answer");
        b.append(el("span", { class: "tag ans" }, "✓ answer"));
      }
      if (choice === i && state.revealed) b.append(el("span", { class: "tag you" }, "you"));
      b.disabled = !state.open;
      b.addEventListener("click", () => vote(q, i));
      opts.append(b);
    });
    $main.append(opts);

    let text = statusText, cls = statusClass || "";
    if (text == null) {
      if (state.revealed && choice != null && state.answer != null) {
        text = choice === state.answer ? "✓ You got it." : "✗ Not this time.";
        cls = choice === state.answer ? "ok" : "err";
      } else if (state.revealed) {
        text = "Results are on the screen.";
      } else if (!state.open) {
        text = choice == null ? "Voting is closed." : "Voting is closed. Your vote is in.";
      } else if (pending && pending.q === q) {
        text = "Sending…";
      } else if (choice != null) {
        text = "✓ Vote recorded. Tap another option to change it.";
        cls = "ok";
      } else {
        text = "Tap an option.";
      }
    }
    $main.append(el("p", { id: "status", class: cls }, text));
    renderScore();
  }

  function vote(q, choice) {
    if (!state || state.q !== q || !state.open) return;
    pending = { q, choice };
    render();
    send();
  }

  function send() {
    if (!pending || !transport) return;
    const p = pending;
    transport.publish("v/" + p.q + "/" + voter, { choice: p.choice, t: Date.now() }, { retain: true }).then((ok) => {
      if (pending !== p) return;          // superseded by a newer tap
      if (ok) {
        mine[p.q] = Object.assign({}, mine[p.q], { choice: p.choice });
        store.set(mineKey, mine);
        pending = null;
        render();
      } else {
        render("Not connected — your vote will be sent when the connection is back.", "err");
      }
    });
  }

  function onState(s) {
    if (!s || typeof s !== "object") return;
    const title = clip(s.title, 80) || "Live poll";
    $title.textContent = title;
    document.title = title;
    scoreText = clip(s.scoreText, 160);
    state = s.q && /^[A-Za-z0-9_-]{1,64}$/.test(String(s.q)) ? {
      q: String(s.q),
      prompt: clip(s.prompt, 500),
      kicker: clip(s.kicker, 120),
      options: Array.isArray(s.options) ? s.options.slice(0, 12).map((o) => clip(o, 200)) : [],
      layout: s.layout === "pair" ? "pair" : "list",
      open: !!s.open,
      revealed: !!s.revealed,
      answer: Number.isInteger(s.answer) ? s.answer : null,
      scored: !!s.scored,
    } : null;
    if (state && state.revealed && state.answer != null && mine[state.q] && mine[state.q].choice != null) {
      mine[state.q].answer = state.answer;
      mine[state.q].scored = state.scored;
      store.set(mineKey, mine);
    }
    if (pending && (!state || pending.q !== state.q)) pending = null;
    render();
  }

  if (!room || !T.ROOM.test(room)) { render(); return; }
  try {
    transport = T.create({
      kind, room, prefix, brokers, clientId: "phone-" + voter.slice(0, 8),
      subscribe: ["state"],
      onMessage(sub, payload) { if (sub === "state") onState(payload || { q: null }); },
      onStatus(up) {
        $conn.className = up ? "up" : "down";
        $conn.textContent = up ? "connected" : "reconnecting";
      },
      onConnect() {
        transport && transport.publish("hello/" + voter, { t: Date.now() });
        send();   // a vote tapped while offline goes out now
      },
    });
  } catch (e) {
    $main.textContent = "Could not start: " + e.message;
    return;
  }
  // The first render before any state arrives.
  setTimeout(() => { if (!state) render(); }, 1500);
})();
</script>
</body>
</html>
